        name: Default key assembly
        revision: 1
        switch:
          at:
            - 0
            - 0
          rotate: 0
          side: B
        diode:
          at:
            - 0
            - -5
          rotate: 0
          side: B
        led:
          at:
            - 0
            - 5
          rotate: 0
          side: B
        options:
          family: mx
          mounting: solder
          diode: true
          led: false
    findings:
      - Component model alignment and physical envelopes require verification before PCB export.
      - Choose a controller before PCB review.
    templates:
      Default key assembly:
        { name: Default key assembly, revision: 1, switch: { at: [ 0, 0 ], rotate: 0, side: B }, diode: { at: [ 0, -5 ], rotate: 0, side: B }, led: { at: [ 0, 5 ], rotate: 0, side: B }, options: { family: mx, mounting: solder, diode: true, led: false } }
    outline:
      bridges:
        main: {}
      managed:
        main:
          [ regions.main, regions.main_components, boundaries.main, profiles.main ]
      auto: true
