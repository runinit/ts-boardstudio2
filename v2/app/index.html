<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2f4f8" />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem('boardstudio:v2:theme');
          const scheme = preference === 'light' || preference === 'dark'
            ? preference
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = scheme;
          document.documentElement.style.colorScheme = scheme;
          document.querySelector('meta[name="theme-color"]').content = scheme === 'dark' ? '#161616' : '#f2f4f8';
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="preload" href="./src/assets/fonts/source-sans-3-upright.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Board Studio v2</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
