name: Validate Board Studio
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, integrate/boardstudio]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-experimental-webstorage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:engine
      - run: pnpm run test:footprints
      - run: pnpm run test:release
      - run: pnpm run precommit
      - run: pnpm run build
      - run: pnpm --dir app exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: app/test-results
          retention-days: 7
